# Embedding service (Qwen3-Embedding-8B on vLLM). Set EMBED_URL if it runs on another host.
services:
  vllm-qwen3-embed:
    image: vllm/vllm-openai:v0.21.0
    container_name: vllm-qwen3-embed
    runtime: nvidia

    ports:
      - "8002:8000"

    volumes:
      - ${EMBED_MODEL_DIR:-./models/Qwen3-Embedding-8B}:/models/Qwen3-Embedding-8B

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command:
      - --model
      - /models/Qwen3-Embedding-8B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --gpu-memory-utilization
      - "0.3"
      - --served-model-name
      - qwen3-embedding-8b

    restart: unless-stopped