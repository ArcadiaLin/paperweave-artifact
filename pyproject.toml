# Workspace root: one lockfile and one .venv for the system and its packages.
[project]
name = "paperweave"
version = "0.1.0"
description = "PaperWeave: data management for knowledge accumulated by LLM agents (anonymous artifact)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.workspace]
members = [
    "experiments/e09",
    "packages/graph-vc",
    "packages/graph-doc",
]

[dependency-groups]
test = [
    "pytest>=8,<9",
]
